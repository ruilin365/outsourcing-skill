<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <title>待办事项 · 手机版</title>
  <script>
    (function () {
      try {
        var THEME_KEY = 'simple_todo_theme_v1';
        var t = localStorage.getItem(THEME_KEY);
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    /* ================= 主题变量 ================= */
    :root {
      --page-bg: #e8eef6;
      --app-bg: #f7f9fc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --border: #e6ecf3;
      --border-strong: #d9e3ee;
      --text: #0f172a;
      --text-2: #1e293b;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --accent: #15803d;
      --on-accent: #ffffff;
      --accent-soft: #eafaf0;
      --accent-border: #bbe7cb;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --nav-bg: rgba(255, 255, 255, 0.86);
      --nav-border: rgba(230, 236, 243, 0.9);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 12px 30px rgba(15, 23, 42, 0.16);
      --focus-ring: rgba(21, 128, 61, 0.14);
      --thumb: #cbd5e1;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --page-bg: #04070d;
      --app-bg: #0b1220;
      --surface: #151f31;
      --surface-2: #1b2739;
      --border: #22304a;
      --border-strong: #2c3d59;
      --text: #eaf1fb;
      --text-2: #dde6f3;
      --muted: #93a3b8;
      --muted-2: #71829a;
      --accent: #22c55e;
      --on-accent: #04240f;
      --accent-soft: rgba(34, 197, 94, 0.12);
      --accent-border: rgba(34, 197, 94, 0.30);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.16);
      --nav-bg: rgba(21, 31, 49, 0.88);
      --nav-border: rgba(44, 61, 89, 0.7);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.6);
      --focus-ring: rgba(34, 197, 94, 0.2);
      --thumb: #33425c;
      color-scheme: dark;
    }

    /* ================= 基础 ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--page-bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100dvh;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ================= App 外壳 ================= */
    .app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      background: var(--app-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.25s ease;
    }

    /* 顶部标题栏 */
    .app-bar {
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px;
      background: var(--app-bg);
      border-bottom: 1px solid var(--border);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .app-bar h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .stats {
      flex-shrink: 0;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    /* 主体内容区 */
    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 14px 18px calc(104px + env(safe-area-inset-bottom, 0px));
      scrollbar-width: thin;
      scrollbar-color: var(--thumb) transparent;
    }

    .content::-webkit-scrollbar {
      width: 5px;
    }

    .content::-webkit-scrollbar-thumb {
      background: var(--thumb);
      border-radius: 20px;
    }

    /* 搜索框 */
    .search-section {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--surface-2);
      border: 1.5px solid var(--border-strong);
      border-radius: 16px;
      margin-bottom: 12px;
      transition: border-color 0.18s, background-color 0.18s, box-shadow 0.18s;
    }

    .search-section:focus-within {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    .search-icon {
      flex-shrink: 0;
      font-size: 0.85rem;
      line-height: 1;
      opacity: 0.6;
    }

    .search-section input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      padding: 12px 0;
      font-size: 0.92rem;
      color: var(--text);
      font-family: inherit;
    }

    .search-section input::placeholder {
      color: var(--muted-2);
    }

    .search-section input::-webkit-search-cancel-button,
    .search-section input::-webkit-search-decoration {
      -webkit-appearance: none;
      appearance: none;
    }

    .search-clear {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: var(--border);
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .search-clear:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .search-clear[hidden] {
      display: none;
    }

    /* 使用说明 */
    .instruction {
      display: flex;
      gap: 8px;
      font-size: 0.78rem;
      line-height: 1.6;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px 12px;
      margin-bottom: 14px;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .instruction::before {
      content: "📌";
      font-size: 0.88rem;
      line-height: 1.6;
      flex-shrink: 0;
    }

    /* 新增任务 */
    .add-section {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-section input {
      flex: 1;
      min-width: 0;
      padding: 13px 16px;
      border: 1.5px solid var(--border-strong);
      border-radius: 16px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s, background-color 0.18s, color 0.18s;
    }

    .add-section input::placeholder {
      color: var(--muted-2);
    }

    .add-section input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    .add-section button {
      flex-shrink: 0;
      min-height: 48px;
      padding: 0 20px;
      border: none;
      border-radius: 16px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s, background-color 0.25s, color 0.25s;
    }

    .add-section button:hover {
      filter: brightness(1.05);
    }

    .add-section button:active {
      transform: scale(0.96);
    }

    /* 列表工具条 */
    .list-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .list-title {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .clear-btn {
      border: none;
      background: transparent;
      color: var(--danger);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, opacity 0.15s;
    }

    .clear-btn:hover,
    .clear-btn:focus-visible {
      background: var(--danger-soft);
      outline: none;
    }

    .clear-btn:active {
      transform: scale(0.96);
    }

    .clear-btn:disabled {
      opacity: 0.35;
      cursor: default;
      background: transparent;
      pointer-events: none;
    }

    /* 任务列表 */
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 单条任务：外层负责裁剪滑动 */
    .todo-item {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      animation: itemIn 0.18s ease;
    }

    @keyframes itemIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 左滑后露出的删除操作区 */
    .todo-actions {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 76px;
      background: var(--danger);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .swipe-delete {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .swipe-delete:active {
      background: rgba(0, 0, 0, 0.12);
    }

    /* 可滑动的任务主体 */
    .todo-main {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 8px 10px 14px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.24s cubic-bezier(0.22, 0.61, 0.36, 1),
                  background-color 0.25s ease,
                  border-color 0.25s ease;
      will-change: transform;
      touch-action: pan-y;
    }

    .todo-item:hover .todo-main {
      border-color: var(--border-strong);
    }

    /* 复选框 */
    .todo-main input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: 2px solid var(--border-strong);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .todo-main input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-main input[type="checkbox"]:checked::after {
      content: "✓";
      color: var(--on-accent);
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      margin-top: -1px;
    }

    .todo-main input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* 任务文本 */
    .todo-text {
      flex: 1;
      min-width: 0;
      font-size: 0.95rem;
      line-height: 1.35;
      color: var(--text-2);
      padding: 2px 0;
      word-break: break-word;
      transition: color 0.2s;
    }

    .todo-text-content {
      cursor: text;
    }

    .todo-time {
      display: block;
      font-size: 0.72rem;
      color: var(--muted-2);
      margin-top: 3px;
      line-height: 1.2;
    }

    .todo-item.completed .todo-text-content {
      text-decoration: line-through;
      color: var(--muted-2);
    }

    .todo-item.completed .todo-time {
      opacity: 0.7;
    }

    .todo-edit-input {
      width: 100%;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: 10px;
      padding: 5px 9px;
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    /* 删除按钮（常驻 ✕） */
    .delete-btn {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted-2);
      font-size: 1.05rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, transform 0.1s;
    }

    .delete-btn:hover,
    .delete-btn:focus-visible {
      background: var(--danger-soft);
      color: var(--danger);
      outline: none;
    }

    .delete-btn:active {
      transform: scale(0.88);
    }

    /* 空状态 */
    .empty-message {
      list-style: none;
      text-align: center;
      color: var(--muted-2);
      font-size: 0.88rem;
      padding: 34px 14px;
      background: var(--surface-2);
      border: 1px dashed var(--border-strong);
      border-radius: 18px;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    /* ================= 底部悬浮导航栏 ================= */
    .bottom-nav {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 30;
      display: flex;
      align-items: stretch;
      gap: 4px;
      padding: 6px;
      background: var(--nav-bg);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--nav-border);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .nav-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 2px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: 18px;
      cursor: pointer;
      transition: background-color 0.18s, color 0.18s, transform 0.1s;
    }

    .nav-icon {
      font-size: 1.02rem;
      line-height: 1;
      transition: transform 0.18s;
    }

    .nav-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .nav-btn.active .nav-icon {
      transform: translateY(-1px) scale(1.06);
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    /* ================= 桌面端外壳 ================= */
    @media (min-width: 520px) {
      body {
        align-items: center;
        padding: 24px 16px;
      }

      .app {
        height: min(880px, calc(100dvh - 48px));
        border-radius: 34px;
        border: 1px solid var(--border);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18), 0 4px 12px rgba(15, 23, 42, 0.06);
      }

      html[data-theme="dark"] .app {
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      }

      .app-bar {
        padding-top: 16px;
      }
    }

    @media (max-width: 380px) {
      .app-bar h1 {
        font-size: 1.05rem;
      }

      .stats {
        font-size: 0.64rem;
        padding: 5px 8px;
      }

      .nav-btn {
        font-size: 0.6rem;
      }

      .add-section button {
        padding: 0 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 顶部标题栏 + 统计 -->
    <header class="app-bar">
      <h1>我的待办清单</h1>
      <span class="stats" id="uncompletedCount">共 0 项 / 未完成 0 项</span>
    </header>

    <!-- 主体内容 -->
    <main class="content">
      <!-- 搜索框 -->
      <div class="search-section">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="searchInput" placeholder="搜索任务关键字…" autocomplete="off" aria-label="搜索任务">
        <button class="search-clear" id="searchClearBtn" type="button" aria-label="清空搜索" hidden>✕</button>
      </div>

      <div class="instruction">
        输入任务后按回车或点击“添加”；双击文字可编辑；勾选标记完成；左滑条目或点击 ✕ 删除。
      </div>

      <div class="add-section">
        <input type="text" id="todoInput" placeholder="写一个新的任务…" autocomplete="off" aria-label="新任务内容">
        <button id="addBtn" type="button" aria-label="添加任务">添加</button>
      </div>

      <div class="list-bar">
        <span class="list-title" id="listTitle">全部任务</span>
        <button class="clear-btn" id="clearCompletedBtn" type="button" aria-label="清空已完成任务">清空已完成</button>
      </div>

      <ul class="todo-list" id="todoList"></ul>
    </main>

    <!-- 底部悬浮导航栏 -->
    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-btn active" type="button" data-filter="all" aria-label="全部任务">
        <span class="nav-icon">📋</span>
        <span>全部</span>
      </button>
      <button class="nav-btn" type="button" data-filter="active" aria-label="未完成任务">
        <span class="nav-icon">⏳</span>
        <span>待办</span>
      </button>
      <button class="nav-btn" type="button" data-filter="completed" aria-label="已完成任务">
        <span class="nav-icon">✅</span>
        <span>已完成</span>
      </button>
      <button class="nav-btn" type="button" id="themeToggle" aria-label="切换深色模式" aria-pressed="false">
        <span class="nav-icon" id="themeIcon">☀️</span>
        <span id="themeLabel">浅色</span>
      </button>
    </nav>
  </div>

  <script>
    (function () {
      'use strict';

      // ---------- 常量 ----------
      const STORAGE_KEY = 'simple_todo_list_v1';
      const THEME_KEY = 'simple_todo_theme_v1';
      const SWIPE_WIDTH = 76;
      const FILTER_TITLES = {
        all: '全部任务',
        active: '未完成任务',
        completed: '已完成任务'
      };

      // ---------- 状态 ----------
      // 待办数据结构: { id: string, text: string, completed: boolean, createdAt: number }
      let todos = [];
      let currentFilter = 'all';
      let searchKeyword = '';

      // ---------- DOM ----------
      const todoInput = document.getElementById('todoInput');
      const addBtn = document.getElementById('addBtn');
      const todoListEl = document.getElementById('todoList');
      const uncompletedCountEl = document.getElementById('uncompletedCount');
      const listTitleEl = document.getElementById('listTitle');
      const filterBtns = document.querySelectorAll('.nav-btn[data-filter]');
      const clearCompletedBtn = document.getElementById('clearCompletedBtn');
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const themeLabel = document.getElementById('themeLabel');
      const searchInput = document.getElementById('searchInput');
      const searchClearBtn = document.getElementById('searchClearBtn');

      // ---------- 工具函数 ----------
      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
      }

      function formatTime(timestamp) {
        if (!timestamp) return '—';
        const d = new Date(timestamp);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}`;
      }

      function saveTodos() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (e) {
          console.warn('无法保存到 localStorage', e);
        }
      }

      function loadTodos() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) {
            todos = [];
            return;
          }
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed)) {
            todos = parsed
              .filter(item =>
                item &&
                typeof item.id === 'string' &&
                typeof item.text === 'string' &&
                typeof item.completed === 'boolean'
              )
              .map(item => ({
                id: item.id,
                text: item.text,
                completed: item.completed,
                createdAt: typeof item.createdAt === 'number' ? item.createdAt : undefined
              }));
          } else {
            todos = [];
          }
        } catch (e) {
          console.warn('读取本地数据失败', e);
          todos = [];
        }
      }

      // 顶部统计：共 N 项 / 未完成 M 项
      function updateStats() {
        const total = todos.length;
        const activeCount = todos.filter(t => !t.completed).length;
        uncompletedCountEl.textContent = `共 ${total} 项 / 未完成 ${activeCount} 项`;
      }

      function getFilteredTodos() {
        let list = todos;

        if (currentFilter === 'active') {
          list = list.filter(t => !t.completed);
        } else if (currentFilter === 'completed') {
          list = list.filter(t => t.completed);
        }

        const q = searchKeyword.trim().toLowerCase();
        if (q) {
          list = list.filter(t => t.text.toLowerCase().indexOf(q) !== -1);
        }

        return list;
      }

      // ---------- 滑动删除 ----------
      let openItemEl = null;

      function closeSwipeItem(item) {
        if (!item) return;
        const main = item.querySelector('.todo-main');
        item.classList.remove('swiped');
        if (main) {
          main.style.transition = '';
          main.style.transform = 'translateX(0)';
        }
        if (openItemEl === item) openItemEl = null;
      }

      function openSwipeItem(item) {
        if (openItemEl && openItemEl !== item) closeSwipeItem(openItemEl);
        const main = item.querySelector('.todo-main');
        item.classList.add('swiped');
        if (main) {
          main.style.transition = '';
          main.style.transform = 'translateX(' + (-SWIPE_WIDTH) + 'px)';
        }
        openItemEl = item;
      }

      function closeAllSwipeItems() {
        if (openItemEl) closeSwipeItem(openItemEl);
        document.querySelectorAll('.todo-item.swiped').forEach(el => {
          if (el !== openItemEl) closeSwipeItem(el);
        });
        openItemEl = null;
      }

      function initSwipe(item, main) {
        let startX = 0;
        let startY = 0;
        let base = 0;
        let deltaX = 0;
        let locked = null; // null | 'x' | 'y'

        main.addEventListener('touchstart', function (e) {
          if (e.touches.length !== 1) return;
          closeAllSwipeItems();
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          base = item.classList.contains('swiped') ? -SWIPE_WIDTH : 0;
          deltaX = 0;
          locked = null;
          main.style.transition = 'none';
        }, { passive: true });

        main.addEventListener('touchmove', function (e) {
          if (e.touches.length !== 1) return;

          const dx = e.touches[0].clientX - startX;
          const dy = e.touches[0].clientY - startY;

          if (locked === null) {
            if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
              locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            } else {
              return;
            }
          }

          if (locked === 'y') return;

          deltaX = dx;
          let offset = base + dx;

          // 阻尼效果
          if (offset > 0) {
            offset = offset * 0.25;
          } else if (offset < -SWIPE_WIDTH) {
            offset = -SWIPE_WIDTH + (offset + SWIPE_WIDTH) * 0.25;
          }

          main.style.transform = 'translateX(' + offset + 'px)';

          if (e.cancelable) e.preventDefault();
        }, { passive: false });

        main.addEventListener('touchend', function () {
          main.style.transition = '';

          if (locked === 'x') {
            const offset = base + deltaX;
            if (offset < -SWIPE_WIDTH * 0.45) {
              openSwipeItem(item);
            } else {
              closeSwipeItem(item);
            }
          } else {
            // 轻点或垂直滚动：若已展开则收起
            closeSwipeItem(item);
            main.style.transform = 'translateX(0)';
          }

          locked = null;
          deltaX = 0;
        }, { passive: true });

        main.addEventListener('touchcancel', function () {
          main.style.transition = '';
          closeSwipeItem(item);
          locked = null;
          deltaX = 0;
        }, { passive: true });
      }

      // 点击空白处收起滑动
      document.addEventListener('touchstart', function (e) {
        if (!openItemEl) return;
        if (e.target.closest && e.target.closest('.todo-item')) return;
        closeAllSwipeItems();
      }, { passive: true });

      // ---------- 渲染 ----------
      function render() {
        const filtered = getFilteredTodos();
        openItemEl = null;
        todoListEl.innerHTML = '';

        if (filtered.length === 0) {
          const emptyLi = document.createElement('li');
          emptyLi.className = 'empty-message';

          if (searchKeyword.trim()) {
            emptyLi.textContent = '🔍 没有找到匹配的任务';
          } else if (currentFilter === 'all') {
            emptyLi.textContent = '✨ 这里空空的，添加一条任务吧';
          } else if (currentFilter === 'active') {
            emptyLi.textContent = '🎉 没有未完成的任务，很棒！';
          } else {
            emptyLi.textContent = '📭 还没有已完成的任务';
          }

          todoListEl.appendChild(emptyLi);
        } else {
          filtered.forEach(todo => {
            const li = document.createElement('li');
            li.className = 'todo-item' + (todo.completed ? ' completed' : '');
            li.dataset.id = todo.id;

            // ---- 左滑操作区 ----
            const actions = document.createElement('div');
            actions.className = 'todo-actions';

            const swipeDeleteBtn = document.createElement('button');
            swipeDeleteBtn.type = 'button';
            swipeDeleteBtn.className = 'swipe-delete';
            swipeDeleteBtn.textContent = '删除';
            swipeDeleteBtn.setAttribute('aria-label', '删除任务');
            swipeDeleteBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              deleteTodo(todo.id);
            });

            actions.appendChild(swipeDeleteBtn);

            // ---- 任务主体 ----
            const main = document.createElement('div');
            main.className = 'todo-main';

            // 复选框
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = todo.completed;
            checkbox.setAttribute('aria-label', todo.completed ? '标记为未完成' : '标记为已完成');
            checkbox.addEventListener('change', function (e) {
              e.stopPropagation();
              toggleTodoComplete(todo.id);
            });

            // 文本容器
            const textSpan = document.createElement('span');
            textSpan.className = 'todo-text';

            const contentSpan = document.createElement('span');
            contentSpan.className = 'todo-text-content';
            contentSpan.textContent = todo.text;
            contentSpan.title = '双击编辑';
            contentSpan.addEventListener('dblclick', function (e) {
              e.stopPropagation();
              startEditTodo(todo.id, contentSpan);
            });

            const timeSpan = document.createElement('span');
            timeSpan.className = 'todo-time';
            timeSpan.textContent = formatTime(todo.createdAt);

            textSpan.appendChild(contentSpan);
            textSpan.appendChild(timeSpan);

            // 常驻删除按钮
            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'delete-btn';
            deleteBtn.setAttribute('aria-label', '删除任务');
            deleteBtn.innerHTML = '✕';
            deleteBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              deleteTodo(todo.id);
            });

            main.appendChild(checkbox);
            main.appendChild(textSpan);
            main.appendChild(deleteBtn);

            li.appendChild(actions);
            li.appendChild(main);

            initSwipe(li, main);

            todoListEl.appendChild(li);
          });
        }

        updateStats();

        const hasCompleted = todos.some(t => t.completed);
        clearCompletedBtn.disabled = !hasCompleted;
      }

      // ---------- 核心操作 ----------
      function addTodo() {
        const text = todoInput.value.trim();
        if (text === '') {
          todoInput.focus();
          return;
        }

        todos.push({
          id: generateId(),
          text: text,
          completed: false,
          createdAt: Date.now()
        });

        todoInput.value = '';
        todoInput.focus();
        saveTodos();

        if (currentFilter === 'completed') {
          setFilter('all');
        } else {
          render();
        }
      }

      function toggleTodoComplete(id) {
        const todo = todos.find(t => t.id === id);
        if (todo) {
          todo.completed = !todo.completed;
          saveTodos();
          render();
        }
      }

      function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        saveTodos();
        render();
      }

      function startEditTodo(id, contentEl) {
        const todo = todos.find(t => t.id === id);
        if (!todo) return;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'todo-edit-input';
        input.value = todo.text;
        input.setAttribute('aria-label', '编辑任务内容');

        const parent = contentEl.parentNode;
        parent.replaceChild(input, contentEl);
        input.focus();
        input.select();

        let finished = false;

        function saveEdit() {
          if (finished) return;
          finished = true;
          const newText = input.value.trim();
          if (newText === '') {
            render();
            return;
          }
          if (newText !== todo.text) {
            todo.text = newText;
            saveTodos();
          }
          render();
        }

        function cancelEdit() {
          if (finished) return;
          finished = true;
          render();
        }

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            saveEdit();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            cancelEdit();
          }
        });

        input.addEventListener('blur', function () {
          saveEdit();
        });
      }

      function clearCompleted() {
        if (!todos.some(t => t.completed)) return;
        todos = todos.filter(t => !t.completed);
        saveTodos();
        render();
      }

      function setFilter(filter) {
        currentFilter = filter;
        filterBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.filter === filter);
        });
        listTitleEl.textContent = FILTER_TITLES[filter] || '全部任务';
        render();
      }

      // ---------- 深色模式 ----------
      function setTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        themeIcon.textContent = isDark ? '🌙' : '☀️';
        themeLabel.textContent = isDark ? '深色' : '浅色';
        themeToggle.setAttribute('aria-pressed', String(isDark));
        themeToggle.setAttribute('aria-label', isDark ? '切换到浅色模式' : '切换到深色模式');

        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#0b1220' : '#f7f9fc');

        try {
          localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        } catch (e) {
          /* 忽略 */
        }
      }

      function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        setTheme(current === 'dark' ? 'light' : 'dark');
      }

      // ---------- 事件绑定 ----------
      function bindEvents() {
        addBtn.addEventListener('click', addTodo);

        todoInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            addTodo();
          }
        });

        filterBtns.forEach(btn => {
          btn.addEventListener('click', function () {
            const filter = btn.dataset.filter;
            if (filter && filter !== currentFilter) {
              setFilter(filter);
            }
          });
        });

        clearCompletedBtn.addEventListener('click', clearCompleted);

        themeToggle.addEventListener('click', toggleTheme);

        // 搜索：实时过滤
        searchInput.addEventListener('input', function () {
          searchKeyword = searchInput.value;
          searchClearBtn.hidden = searchKeyword.length === 0;
          render();
        });

        searchInput.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            clearSearch();
          }
        });

        searchClearBtn.addEventListener('click', function () {
          clearSearch();
        });
      }

      function clearSearch() {
        searchInput.value = '';
        searchKeyword = '';
        searchClearBtn.hidden = true;
        render();
        searchInput.focus();
      }

      // ---------- 初始化 ----------
      function init() {
        loadTodos();

        const savedTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        setTheme(savedTheme);

        searchClearBtn.hidden = true;
        setFilter('all');
        bindEvents();
      }

      init();
    })();
  </script>
</body>
